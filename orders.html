<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow Fast - Order History</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #3b82f6;
      padding: 15px;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* Top Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .header-bar h3 {
      font-size: 16px;
      color: #1e3a8a;
    }

    .back-btn {
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    /* Order Card List */
    .order-card {
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .order-id {
      font-weight: bold;
      color: #1e3a8a;
      font-size: 14px;
    }

    .order-status {
      background: #fef08a;
      color: #854d0e;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
    }

    .order-details p {
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
    }

    .order-charge {
      font-weight: bold;
      color: #2563eb;
      margin-top: 5px;
    }

    .no-orders {
      background: white;
      text-align: center;
      padding: 30px;
      border-radius: 12px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header-bar">
      <h3>📋 My Orders</h3>
      <a href="dashboard.html" class="back-btn">⬅ Dashboard</a>
    </div>

    <div id="ordersContainer">
      <!-- Dynamic Orders Will Be Inserted Here -->
    </div>

  </div>

  <script>
    function loadOrders() {
      const ordersContainer = document.getElementById("ordersContainer");
      const orderHistory = JSON.parse(localStorage.getItem("smm_orders")) || [];

      if (orderHistory.length === 0) {
        ordersContainer.innerHTML = `<div class="no-orders">এখনো কোনো অর্ডার করা হয়নি!</div>`;
        return;
      }

      ordersContainer.innerHTML = "";
      orderHistory.forEach(order => {
        const card = document.createElement("div");
        card.className = "order-card";
        card.innerHTML = `
          <div class="order-header">
            <span class="order-id">Order #${order.id}</span>
            <span class="order-status">${order.status}</span>
          </div>
          <div class="order-details">
            <p><strong>Service:</strong> ${order.service}</p>
            <p class="order-charge"><strong>Charge:</strong> ₹${order.charge}</p>
          </div>
        `;
        ordersContainer.appendChild(card);
      });
    }

    window.onload = loadOrders;
  </script>

</body>
</html>
