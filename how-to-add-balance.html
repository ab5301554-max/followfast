<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How to Add Balance</title>
</head>
<body style="margin: 0; padding: 20px; font-family: sans-serif; text-align: center; background-color: #f4f6f9;">

  <div style="background: #ffffff; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    
    <!-- Buttons Row -->
    <div style="display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 20px; flex-wrap: wrap;">
      
      <!-- Add Balance Button -->
      <a href="#add-funds" style="background-color: #007bff; color: #ffffff; padding: 10px 20px; text-decoration: none; border-radius: 25px; font-weight: bold; font-size: 15px; display: inline-block;">
        Add Balance
      </a>
      
      <!-- YouTube How to Add Balance Button -->
      <a href="https://youtube.com/shorts/wUjOodaSC9I?si=Buo82z5V7THWX-mg" target="_blank" style="background-color: #ff0000; color: #ffffff; padding: 10px 20px; text-decoration: none; border-radius: 25px; font-weight: bold; font-size: 15px; display: inline-flex; align-items: center; gap: 6px;">
        ▶ How to Add Balance
      </a>
      
    </div>

    <!-- Balance Card -->
    <div style="border: 1px solid #e0e0e0; border-radius: 10px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 24px;">👛</span>
      <div style="text-align: right;">
        <div style="color: #666; font-size: 14px; font-weight: 500;">Balance</div>
        <div style="font-size: 20px; font-weight: bold; color: #111;">₹0.00</div>
      </div>
    </div>

    <!-- Spent Card -->
    <div style="border: 1px solid #e0e0e0; border-radius: 10px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 24px;">💳</span>
      <div style="text-align: right;">
        <div style="color: #666; font-size: 14px; font-weight: 500;">You Spent</div>
        <div style="font-size: 20px; font-weight: bold; color: #111;">₹0.00</div>
      </div>
    </div>

    <!-- Panel Orders Card -->
    <div style="border: 1px solid #e0e0e0; border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 24px;">📋</span>
      <div style="text-align: right;">
        <div style="color: #666; font-size: 14px; font-weight: 500;">Panel Orders</div>
        <div style="font-size: 20px; font-weight: bold; color: #111;">13040793</div>
      </div>
    </div>

  </div>

</body>
</html>
