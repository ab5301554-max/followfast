<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Balance - Follow Fast</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0e14;
      color: #ffffff;
      text-align: center;
    }
    .container {
      max-width: 360px;
      margin: 0 auto;
    }
    .brand-title {
      color: #00ff66;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 25px;
    }
    .sub-title {
      font-size: 18px;
      color: #e0e0e0;
      margin-bottom: 8px;
    }
    .min-deposit {
      font-size: 26px;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 12px;
    }
    .scan-text {
      font-size: 16px;
      color: #cccccc;
      margin-bottom: 20px;
    }
    .qr-container {
      margin: 20px 0;
      background: #ffffff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      max-width: 100%;
    }
    .qr-image {
      width: 100%;
      max-width: 240px;
      height: auto;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
    }
    .input-box {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border: 1px solid #ffffff;
      border-radius: 4px;
      background: transparent;
      color: #ffffff;
      box-sizing: border-box;
      font-size: 15px;
      outline: none;
    }
    .input-box::placeholder {
      color: #aaaaaa;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #ffffff;
      color: #000000;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      box-sizing: border-box;
      text-decoration: none;
      display: block;
      margin-bottom: 12px;
    }
    #error-msg {
      color: #ff4d4d;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-title">FOLLOW FAST</div>
    <div class="sub-title">Add Balance</div>
    <div class="min-deposit">Minimum Deposit: ₹40</div>
    <div class="scan-text">Scan QR Code & Pay</div>

    <!-- Full Responsive QR Image Container -->
    <div class="qr-container">
      <img src="https://iili.io/J15Jv7p.jpg" alt="QR Code" class="qr-image">
    </div>

    <!-- Form Inputs -->
    <input type="number" id="amountInput" placeholder="Enter Amount" class="input-box">
    <input type="text" id="utrInput" placeholder="Enter UTR / Transaction ID" class="input-box">

    <!-- Red Error Message Show Box -->
    <div id="error-msg"></div>

    <!-- Action Buttons -->
    <button type="button" class="btn" onclick="processPayment()">Submit Payment</button>
    <a href="dashboard.html" class="btn">Back to Dashboard</a>
  </div>

  <script>
    function processPayment() {
      const amount = document.getElementById('amountInput').value.trim();
      const utr = document.getElementById('utrInput').value.trim();
      const errorMsg = document.getElementById('error-msg');

      if (!amount || amount < 40) {
        errorMsg.innerText = "Please enter a valid amount (Minimum ₹40).";
        errorMsg.style.display = "block";
        return;
      }

      if (!utr) {
        errorMsg.innerText = "Please enter UTR / Transaction ID.";
        errorMsg.style.display = "block";
        return;
      }

      errorMsg.innerText = "Wrong Transaction ID or Payment Not Received!";
      errorMsg.style.display = "block";
    }
  </script>

</body>
</html>
