<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Balance - Follow Fast</title>
</head>
<body style="margin: 0; padding: 20px; font-family: sans-serif; text-align: center; background-color: #0d1117; color: #ffffff;">

  <div style="max-width: 400px; margin: 0 auto;">
    
    <h1 style="color: #00ff7f; font-size: 28px; margin-bottom: 20px;">FOLLOW FAST</h1>
    
    <h3 style="margin-bottom: 10px; font-weight: normal;">Add Balance</h3>
    
    <h2 style="font-size: 24px; margin-top: 5px; margin-bottom: 20px;">Minimum Deposit: ₹40</h2>
    
    <p style="color: #ccc; margin-bottom: 15px;">Scan QR Code & Pay</p>

    <!-- QR Code Image -->
    <div style="margin: 20px 0;">
      <img src="https://i.ibb.co/9kJByhdj/qr.png" alt="QR Code" style="max-width: 220px; width: 100%; height: auto; border-radius: 8px; border: 2px solid #ffffff;">
    </div>

    <!-- Payment Inputs -->
    <div style="margin-top: 20px;">
      <input type="number" placeholder="Enter Amount" style="width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px;">
      
      <input type="text" placeholder="Enter UTR / Transaction ID" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px;">
      
      <button type="button" style="background-color: #ffffff; color: #000000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; font-size: 15px; margin-bottom: 12px;">Submit Payment</button>
      
      <a href="dashboard.html" style="display: block; background-color: #ffffff; color: #000000; text-decoration: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; font-size: 15px;">Back to Dashboard</a>
    </div>

  </div>

</body>
</html>
