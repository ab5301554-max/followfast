<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Balance - Follow Fast</title>
<link rel="stylesheet" href="style.css">
<style>
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
  }
  .modal img {
    width: 85%;
    max-width: 400px;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
  }
</style>
</head>

<body>

<div class="header">
<h1>FOLLOW FAST</h1>
<p>Add Balance</p>
</div>

<div class="card">

<h2>Minimum Deposit: ₹40</h2>

<p>Scan QR Code & Pay</p>

<img src="https://i.ibb.co/NdXKzR4q/qr.png" width="220" id="qrImg" style="cursor: pointer;" onclick="openModal()">

<br><br>

<input type="number" placeholder="Enter Amount">

<br><br>

<input type="text" placeholder="Enter UTR / Transaction ID">

<br><br>

<button type="button" onclick="showError()">Submit Payment</button>

<p id="statusMsg" style="margin-top:20px; font-weight: bold;"></p>

<a href="dashboard.html">
<button>Back to Dashboard</button>
</a>

</div>

<div id="imgModal" class="modal" onclick="closeModal()">
  <img src="https://i.ibb.co/NdXKzR4q/qr.png" alt="QR Code Large">
</div>

<script>
  function openModal() {
    document.getElementById("imgModal").style.display = "flex";
  }
  function closeModal() {
    document.getElementById("imgModal").style.display = "none";
  }

  function showError() {
    let amount = document.querySelectorAll('input')[0].value;
    let trxn = document.querySelectorAll('input')[1].value;
    let msgBox = document.getElementById('statusMsg');

    if (!amount || !trxn) {
      msgBox.style.color = "orange";
      msgBox.innerText = "Please enter Amount and Transaction ID!";
      return;
    }

    msgBox.style.color = "#ef4444"; // Red Color
    msgBox.innerText = "Wrong Transaction ID";
  }
</script>

</body>
</html>
